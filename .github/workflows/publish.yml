name: Publish pilot images

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed current main (full 40-character SHA)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pilot-image-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish reviewed source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 -B scripts/publish.py
